
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proyecto 2 lenguajes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <style>
        body {
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .card {
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: calc(33.33% - 10px);
            flex-grow: 1;
            flex-basis: 0;
            margin-right: 10px;
            margin-left: 10px;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .card:hover .overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .card img {
            width: 100%;
            height: auto;
            object-fit: cover;
            vertical-align: top;
        }

        .card .overlay {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(100%);
            transition: all 0.3s ease;
        }

        .card .overlay h2 {
            font-size: 24px;
            margin: 0;
        }

        .card .overlay p {
            font-size: 16px;
            margin: 0;
            margin-top: 10px;
        }

        .btn-primary {
            margin-left: 10px;
        }



    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Proyecto 2</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
                <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Dueños y Autores
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <a class="dropdown-item" th:href="@{/owners}">Dueños</a>
                    <a class="dropdown-item" th:href="@{/authors}">Autores</a>
                    <a class="dropdown-item" th:href="@{/institutions}">Instituciones</a>
                </div>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarTaxonomia" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Taxonomía
                </a>
                <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <a class="dropdown-item" th:href="@{/reinos}">Reinos</a>
                    <a class="dropdown-item" th:href="@{/filos}">Filos</a>
                    <a class="dropdown-item" th:href="@{/clases}">Clases</a>
                    <a class="dropdown-item" th:href="@{/ordens}">Ordenes</a>
                    <a class="dropdown-item" th:href="@{/familias}">Familias</a>
                    <a class="dropdown-item" th:href="@{/generos}">Generos</a>
                </div>
            </li>

        </ul>
        <form class="form-inline my-2 my-lg-0" th:action="@{/buscador}" method="get">
            <input class="form-control mr-sm-2" type="text" placeholder="Search" aria-label="Search" name="clave">
            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
        </form>
        <a class="btn btn-primary" href="/new">New</a>
    </div>
</nav>


<div class="container">
    <div class="card-columns">
        <div th:each="image : ${images}" class="card">
            <a th:href="@{/images/{id}(id=${image.getId()})}">
                <img th:src="@{'/imagenes/' + ${image.getPath()}}" class="card-img-top" alt="...">
            </a>
        </div>
    </div>
    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? disabled : ''">
                <a class="page-link" th:href="@{'/?page=' + ${currentPage - 1}}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                    <span class="sr-only">Previous</span>
                </a>
            </li>
            <li class="page-item" th:each="page : ${#numbers.sequence(0, totalPages - 1)}">
                <a class="page-link" th:href="@{'/?page=' + ${page+1}}" th:classappend="${currentPage == page} ? active : ''" th:text="${page + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? disabled : ''">
                <a class="page-link" th:href="@{'/?page=' + ${currentPage + 2}}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                    <span class="sr-only">Next</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

</body>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</html>
